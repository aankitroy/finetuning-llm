repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # stored copies that must stay byte-identical to their sources
        exclude: ^(dashboard/vendor/|modules/m03_tokenizers/chat_template\.jinja$|modules/m04_training_loop/shakespeare\.txt$)
      - id: trailing-whitespace
        # stored copies that must stay byte-identical to their sources
        exclude: ^(dashboard/vendor/|modules/m03_tokenizers/chat_template\.jinja$|modules/m04_training_loop/shakespeare\.txt$)
