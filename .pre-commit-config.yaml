repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # the stored chat template must stay byte-identical to the real one
        exclude: ^(dashboard/vendor/|modules/m03_tokenizers/chat_template\.jinja$)
      - id: trailing-whitespace
        # the stored chat template must stay byte-identical to the real one
        exclude: ^(dashboard/vendor/|modules/m03_tokenizers/chat_template\.jinja$)
