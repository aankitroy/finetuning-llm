[project]
name = "finetuning-llm"
version = "0.1.0"
description = "A hands-on, CLI-first course for learning LLM fine-tuning step by step on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
