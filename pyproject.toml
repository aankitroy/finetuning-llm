[project]
name = "finetuning-llm"
version = "0.1.0"
description = "A hands-on, CLI-first course for learning LLM fine-tuning step by step on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
course = [
    "accelerate>=1.16.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
default-groups = ["dev", "course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["optional_checkpoint: a skip here doesn't fail the checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline fixtures read better unwrapped
# M3 teaches bytes: .encode("utf-8") spelled out, and zip(ids, ids[1:]) for neighbouring pairs
"modules/m03_tokenizers/**" = ["UP012", "B905"]
# M4 pairs up matching lists with plain zip(...), as M1-M3 taught it
"modules/m04_training_loop/**" = ["B905"]
"modules/m05_full_finetune/**" = ["B905"]
