id = "m05"
title = "Your first real fine-tune (full fine-tune)"
part = "B · Training from zero"
order = 5
summary = "Fine-tune every weight of a ~0.5B model on a narrow style task."
est_minutes = 240

[next]
start = "Watch the video on the dashboard, then read modules/m05_full_finetune/README.md and open lesson.ipynb"
finish = "make check M=05"
why = "Your fine-tune makes a real 0.5B model write in plain English, twice: with your loop and with Trainer"

[artifacts]
any = ["outputs/m05/*"]

[[metrics]]
key = "final_loss"
label = "Final val loss"
better = "lower"

[[metrics]]
key = "peak_mem_gb"
label = "Peak memory (GB)"
better = "lower"

[[metrics]]
key = "tokens_per_sec"
label = "Training speed (tokens/sec)"
better = "higher"

[[metrics]]
key = "trainable_pct"
label = "Trainable parameters (%)"
better = "lower"

[[steps]]
kind = "video"
title = "Watch the video"
detail = "A 4-minute narrated animation of the whole idea: what fine-tuning changes, loss masking, padding, where the memory goes, and what the model can forget. Watch it first, with the sound on (captions too)."

[[steps]]
kind = "lesson"
title = "Run the lesson"
detail = "Open the notebook and run every cell, top to bottom. The first cell downloads Qwen2.5-0.5B-Instruct (about 1 GB) once. Section 5 fine-tunes it for real, which takes about a minute and up to 24 GB of memory, so close other big apps first. When a cell says Predict, write your guess down before running it. Save the notebook (Cmd-S) so your progress shows here."
command = "uv run jupyter lab modules/m05_full_finetune/lesson.ipynb"
file = "lesson.ipynb"

[[steps]]
kind = "exercises"
title = "Write the exercises"
detail = "Open exercises.py and replace each `raise NotImplementedError` with your code, following the numbered steps. Run make check M=05 as often as you like; this panel shows which exercises pass."
command = "make check M=05"
file = "exercises.py"

[[steps]]
kind = "answers"
title = "Answer the understanding checks"
detail = "Open answers.toml and put your answer between the quotes for each question. Predict first, then check yourself in the notebook."
command = "make check M=05"
file = "answers.toml"

[[steps]]
kind = "train"
title = "Fine-tune with your own loop"
detail = "Fine-tunes all 494M weights with your exercises in your own training loop, then scores the original and the fine-tuned model on 50 held-out rewrites. About 3 minutes, up to 24 GB of memory."
command = "uv run python modules/m05_full_finetune/train.py --loop"
file = "outputs/m05/run_loop.json"
metric = "heldout_after"

[[steps]]
kind = "train"
title = "Fine-tune with Hugging Face's Trainer"
detail = "The same fine-tune, with Trainer running the loop and your collate() building the batches. Compare its numbers with your loop's."
command = "uv run python modules/m05_full_finetune/train.py --trainer"
file = "outputs/m05/run_trainer.json"
metric = "heldout_after"

[[steps]]
kind = "checkpoint"
title = "Pass the checkpoint"
detail = "Checks your exercises, your answers and both runs together. M5 turns green when everything passes."
command = "make check M=05"
