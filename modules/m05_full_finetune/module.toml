id = "m05"
title = "Your first real fine-tune (full fine-tune)"
part = "B · Training from zero"
order = 5
summary = "Fine-tune every weight of a ~0.5B model on a narrow style task."
est_minutes = 240

[next]
start = "Read modules/m05_full_finetune/README.md, then open lesson.ipynb"
finish = "make check M=05"
