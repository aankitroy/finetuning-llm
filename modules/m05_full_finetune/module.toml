[artifacts]
any = ["outputs/m05/*"]

[[metrics]]
key = "final_loss"
label = "Final val loss"
better = "lower"

[[metrics]]
key = "peak_mem_gb"
label = "Peak memory (GB)"
better = "lower"

[[metrics]]
key = "tokens_per_sec"
label = "Training speed (tokens/sec)"
