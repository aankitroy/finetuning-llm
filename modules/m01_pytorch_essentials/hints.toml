[[exercise]]
id = "q3"
test = "test_understanding[q3]"
hint = "Differentiate (w - 5)^2 by hand, then plug in w = 3. You can also just run it in the notebook."

[[exercise]]
id = "q4"
test = "test_understanding[q4]"
