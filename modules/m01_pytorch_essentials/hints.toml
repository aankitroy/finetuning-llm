# Hints for `make hint M=01 EX=<id>`. `make solution` shows the reference answer.

[[exercise]]
id = "1"
test = "test_linear_forward"
name = "linear_forward"
hint = "One line does all three steps: x @ w gives (batch, out), and + b broadcasts the bias across the rows. Compare with `pred = X @ w + b` in lesson section 3."

[[exercise]]
id = "2"
test = "test_mse_loss"
name = "mse_loss"
hint = "Steps 1-3 fit on one line: (pred - target), then ** 2, then .mean(). .mean() with no arguments already gives a single-number (0-d) tensor."

[[exercise]]
id = "3"
test = "test_sgd_step_updates_and_zeroes_grads"
name = "sgd_step"
hint = "Step 1 is a `with` block that switches off gradient recording (section 2). For step 3, use the in-place form of subtraction (-=) so p stays the same tensor the model holds. Step 4 is the same reset line you saw in the section 2 loop."

[[exercise]]
id = "4"
test = "test_mlp_shapes_and_layers"
name = "MLP"
hint = "In __init__, `self.fc1 = nn.Linear(in_features, hidden)` and the same for the second layer: storing them on self is what registers their parameters. In forward, call self.fc1(x), then F.relu(...), then self.fc2(...). SineNet in section 7 has the same shape."

[[exercise]]
id = "5"
test = "test_train_one_epoch_reduces_loss"
name = "train_one_epoch"
hint = "Step 1: the shuffling function from section 6, given len(X) and device=X.device. Step 3: a for loop over range(0, len(X), batch_size), slicing the shuffled order (section 6). Step 5: F.cross_entropy, logits first. Step 9: .item(). Steps 6-8 are the three lines from section 7's loop."

[[exercise]]
id = "6"
test = "test_accuracy"
name = "accuracy"
hint = "model(X).argmax(dim=1) gives the predicted class for every row. (preds == y) is True/False; .float().mean() turns that into a fraction, and .item() makes it a Python float."

[[exercise]]
id = "q1"
test = "test_understanding[q1]"
hint = "(a, b) @ (b, c) gives (a, c). Then check what adding a (4,) tensor does via broadcasting."

[[exercise]]
id = "q2"
test = "test_understanding[q2]"
