id = "m01"
title = "Tensors, autograd & PyTorch essentials"
part = "A · Foundations"
order = 1
summary = "Learn just enough PyTorch to read and write training code."
est_minutes = 240

[next]
start = "Read modules/m01_pytorch_essentials/README.md, then open lesson.ipynb"
finish = "make check M=01"
why = "Your hand-written MLP reaches at least 95% on the toy dataset"

[artifacts]
any = ["outputs/m01/*"]

[[metrics]]
key = "accuracy"
label = "Accuracy"
better = "higher"

[[steps]]
kind = "lesson"
title = "Run the lesson"
detail = "Open the notebook and run every cell, top to bottom. When a cell says Predict, write your guess down before running it. Save the notebook (Cmd-S) so your progress shows here."
command = "uv run jupyter lab modules/m01_pytorch_essentials/lesson.ipynb"
file = "lesson.ipynb"

[[steps]]
kind = "exercises"
title = "Write the exercises"
detail = "Open exercises.py and replace each `raise NotImplementedError` with your code. Run make check M=01 as often as you like; this panel shows which exercises pass."
command = "make check M=01"
file = "exercises.py"

[[steps]]
kind = "answers"
title = "Answer the understanding checks"
detail = "Open answers.toml and put your answer between the quotes for each question. Work them out in the notebook if you're unsure."
command = "make check M=01"
file = "answers.toml"

[[steps]]
kind = "train"
title = "Train your network"
detail = "Trains your MLP on the two-moons dataset using your own exercises.py. Takes about 5 seconds on your Mac's GPU. It needs to reach 95% validation accuracy."
command = "uv run python modules/m01_pytorch_essentials/train.py"
file = "outputs/m01/run_summary.json"
metric = "val_accuracy"

[[steps]]
kind = "checkpoint"
title = "Pass the checkpoint"
detail = "Checks your exercises, your answers and your training run together. M1 turns green when everything passes."
command = "make check M=01"
