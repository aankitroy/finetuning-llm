# Copy this folder to modules/mNN_your_slug and fill in every field.
id = "mNN"
title = "Module title"
part = "C · Efficient tuning"
order = 99
summary = "One sentence on what the learner builds."
est_minutes = 180

[next]
start = "Read modules/mNN_your_slug/README.md, then open lesson.ipynb"
finish = "make check M=NN"
why = "What passing the checkpoint proves, in one line"

[artifacts]
any = ["outputs/mNN/*"]

# Declare every metric your checkpoint reports. Modules that train a model must
# report peak_mem_gb, tokens_per_sec and trainable_pct (shared across modules).
[[metrics]]
key = "final_loss"
label = "Final val loss"
better = "lower"

# The step-by-step guide on the dashboard. Kinds: lesson, exercises, answers, train, checkpoint.
# Each step's state is detected from files; nothing is ticked by hand.
[[steps]]
kind = "lesson"
title = "Run the lesson"
detail = "Open the notebook and run every cell. Save it so your progress shows here."
command = "uv run jupyter lab modules/mNN_your_slug/lesson.ipynb"
file = "lesson.ipynb"

[[steps]]
kind = "exercises"
title = "Write the exercises"
detail = "Replace each `raise NotImplementedError` in exercises.py with your code."
command = "make check M=NN"
file = "exercises.py"

[[steps]]
kind = "answers"
title = "Answer the understanding checks"
detail = "Fill in each answer in answers.toml."
command = "make check M=NN"
file = "answers.toml"

[[steps]]
kind = "train"
title = "Train"
detail = "What the run does and the result it needs."
command = "uv run python modules/mNN_your_slug/train.py"
file = "outputs/mNN/run_summary.json"
metric = "final_loss"

[[steps]]
kind = "checkpoint"
title = "Pass the checkpoint"
detail = "Checks your exercises, answers and training run together."
command = "make check M=NN"
