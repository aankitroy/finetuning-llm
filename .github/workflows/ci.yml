name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      UV_NO_SYNC: "1"  # keep exactly what `uv sync` installed (no course deps on Linux)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        # Course deps (PyTorch etc.) only on macOS, the course's target platform.
        run: uv sync --python ${{ matrix.python }} ${{ matrix.os == 'ubuntu-latest' && '--no-group course' || '' }}
      - name: Lint
        run: make lint
      - name: Test
        run: uv run pytest
